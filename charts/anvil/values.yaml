# Default values for the Anvil chart.
# Anvil is a webhook server + queue worker backed by Redis. This chart deploys
# all three. There is no database; Redis is the only datastore.

nameOverride: ""
fullnameOverride: ""

# Container image. The repo publishes no image, so image.repository has no
# default and must be set: build apps/server/Dockerfile and apps/worker/Dockerfile
# and push them. The server and worker are separate builds (each runs
# `node dist/index.js`), so set server.image.repository and worker.image.repository
# when they differ; otherwise both fall back to image.repository.
image:
  repository: ""
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# The HMAC secret the server verifies signatures against (WEBHOOK_SECRET).
secret:
  # When create is true, the chart renders a Secret from webhookSecret below.
  # webhookSecret must be set to a real value; the chart refuses to render the
  # placeholder. When false, set existingSecret to a Secret you manage carrying
  # the key under existingSecretKey.
  create: true
  webhookSecret: ""
  existingSecret: ""
  existingSecretKey: "webhook-secret"

server:
  replicas: 1
  port: 3000
  # Optional per-component image repository; falls back to image.repository.
  image:
    repository: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
      ephemeral-storage: 512Mi
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: ""
    annotations: {}
    host: anvil.example.com
    # Path the webhook server serves. Matches apps/server.
    path: /webhooks
    pathType: Prefix
    tls: []

worker:
  # Number of worker pods draining the queue. Mirror this to Terraform's
  # worker_count when you run both.
  replicas: 2
  # Optional per-component image repository; falls back to image.repository.
  image:
    repository: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
      ephemeral-storage: 512Mi

# Redis deployed inside the cluster. Self-contained so the chart needs no
# subchart. For production move to a managed or replicated Redis and set
# redis.deploy to false, then point redis.url at it.
redis:
  deploy: true
  image:
    repository: redis
    tag: "7.4.1"
    pullPolicy: IfNotPresent
  port: 6379
  # Used only when redis.deploy is false. Otherwise the chart builds the URL
  # from the in-cluster Redis service.
  url: ""
  # Redis auth (requirepass). Set password, or point existingSecret at a Secret
  # you manage carrying the password under existingSecretKey. When either is set
  # the in-cluster Redis enforces requirepass and REDIS_URL carries the password.
  password: ""
  existingSecret: ""
  existingSecretKey: "redis-password"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
      # Redis AOF persists to an emptyDir under /data, reserve room for it.
      ephemeral-storage: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: 1Gi

# Applied to every pod.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
