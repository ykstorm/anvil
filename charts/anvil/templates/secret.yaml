{{- if .Values.secret.create }}
{{- if or (not .Values.secret.webhookSecret) (eq .Values.secret.webhookSecret "whsec_changeme") }}
{{- fail "secret.webhookSecret must be set to a real value (not empty, not the placeholder \"whsec_changeme\"). Pass --set secret.webhookSecret=... or use secret.create=false with secret.existingSecret." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "anvil.secretName" . }}
  labels:
    {{- include "anvil.labels" . | nindent 4 }}
type: Opaque
stringData:
  webhook-secret: {{ .Values.secret.webhookSecret | quote }}
{{- end }}
