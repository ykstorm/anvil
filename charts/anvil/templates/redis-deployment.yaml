{{- if .Values.redis.deploy }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "anvil.redisFullname" . }}
  labels:
    {{- include "anvil.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "anvil.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "anvil.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      # Redis serves the queue only, it has no need for a Kubernetes API token.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        # AOF lives here. emptyDir means it is not durable across pod restarts;
        # for durable Redis, move off this in-cluster Deployment (see values.yaml).
        - name: data
          emptyDir: {}
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          # noeviction so queued jobs are never dropped under memory pressure.
          args:
            - "--appendonly"
            - "yes"
            - "--maxmemory-policy"
            - "noeviction"
            - "--dir"
            - "/data"
            {{- if include "anvil.redisAuthEnabled" . }}
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
            {{- end }}
          {{- if include "anvil.redisAuthEnabled" . }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "anvil.redisSecretName" . }}
                  key: {{ include "anvil.redisSecretKey" . }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
          ports:
            - name: redis
              containerPort: {{ .Values.redis.port }}
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            exec:
              {{- if include "anvil.redisAuthEnabled" . }}
              # Authenticate the probe; without this requirepass makes ping NOAUTH.
              command: ["sh", "-c", "redis-cli --no-auth-warning -a \"$REDIS_PASSWORD\" ping"]
              {{- else }}
              command: ["redis-cli", "ping"]
              {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
{{- end }}
