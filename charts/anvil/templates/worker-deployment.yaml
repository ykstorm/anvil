apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "anvil.fullname" . }}-worker
  labels:
    {{- include "anvil.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "anvil.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "anvil.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      # Anvil talks to Redis, never the Kubernetes API, so do not mount a token.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "anvil.image" (list . .Values.worker.image.repository) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/index.js"]
          env:
            {{- if include "anvil.redisAuthEnabled" . }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "anvil.redisSecretName" . }}
                  key: {{ include "anvil.redisSecretKey" . }}
            {{- end }}
            - name: REDIS_URL
              value: {{ include "anvil.redisUrl" . | quote }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
