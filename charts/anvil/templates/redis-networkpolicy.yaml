{{- if .Values.redis.deploy }}
# Restrict ingress to the in-cluster Redis so only the Anvil server and worker
# pods can reach 6379. Everything else in the namespace is denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "anvil.redisFullname" . }}
  labels:
    {{- include "anvil.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  podSelector:
    matchLabels:
      {{- include "anvil.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "anvil.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: server
        - podSelector:
            matchLabels:
              {{- include "anvil.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: worker
      ports:
        - protocol: TCP
          port: {{ .Values.redis.port }}
{{- end }}
