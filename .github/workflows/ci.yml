name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Least privilege by default; the publish job widens it to what it needs.
permissions:
  contents: read

jobs:
  # Full pipeline incl. integration tests. Redis is a Linux-only service
  # container, so the tests that need a queue live here.
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - run: pnpm -r build

      - run: pnpm -r typecheck

      # The examples are workspace packages, so the step above already covers
      # them; this names them so a broken example fails as its own step.
      - name: Type-check the examples
        run: pnpm --filter "./examples/*" typecheck

      - run: pnpm -r lint

      - run: pnpm -r test

  # Cross-OS build/type/lint. No Redis (service containers are Linux-only),
  # so no integration tests here, this guards against path-separator and
  # ESM-resolution breakage on Windows/macOS.
  cross-os:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        node: [20, 22]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      - run: pnpm -r typecheck

      - run: pnpm -r lint

  publish:
    name: Publish @ykstormsorg/anvil to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, cross-os]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 9 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # Trusted publishing needs npm 11.5.1 or newer; the npm bundled with Node 22 is older.
      # Pinned to the 11.x line so a new major npm cannot change the release job unannounced.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1
      # npm publishes from the package folder: the pinned pnpm 9 has no documented
      # trusted publishing support, and the package has no workspace: dependencies.
      # npm authenticates with the OIDC token, so no NODE_AUTH_TOKEN is set.
      - name: Publish to npm
        working-directory: packages/sdk
        run: npm publish --access public --provenance
