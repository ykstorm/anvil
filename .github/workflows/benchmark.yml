name: Benchmark
on:
  push:
    branches: [main]
    paths: ['bench/**', 'packages/**', 'apps/**', '.github/workflows/benchmark.yml']
  pull_request:
    paths: ['bench/**', 'packages/**', 'apps/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: HMAC verify benchmark (pure CPU)
        run: node bench/verify.mjs | tee bench/hmac.txt
      - name: Ingress throughput benchmark (in-memory queue, no Redis)
        run: node bench/throughput.mjs | tee bench/throughput.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anvil-bench
          path: bench/*.txt
