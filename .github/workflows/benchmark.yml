name: Benchmark
on:
  push:
    branches: [main]
    paths: ['bench/**', 'packages/**', 'apps/**', '.github/workflows/benchmark.yml']
  pull_request:
    paths: ['bench/**', 'packages/**', 'apps/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: HMAC verify benchmark (pure CPU)
        run: node bench/verify.mjs | tee bench/hmac.txt
      - name: Ingress throughput benchmark (in-memory queue, no Redis)
        run: node bench/throughput.mjs | tee bench/throughput.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anvil-bench
          path: bench/*.txt
