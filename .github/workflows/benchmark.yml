name: Benchmark
on:
  push:
    branches: [main]
    paths: ['bench/**', 'packages/**', 'apps/**', '.github/workflows/benchmark.yml']
  pull_request:
    paths: ['bench/**', 'packages/**', 'apps/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # pipefail: without it a pipeline exits with tee's status, so a bench that
      # crashed still left the step green (CI run 37333764262).
      - name: HMAC verify benchmark (pure CPU)
        shell: bash
        run: |
          set -o pipefail
          node bench/verify.mjs | tee bench/hmac.txt
      - name: Ingress throughput benchmark (in-memory queue, no Redis)
        shell: bash
        run: |
          set -o pipefail
          node bench/throughput.mjs | tee bench/throughput.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anvil-bench
          path: bench/*.txt
